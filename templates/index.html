<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Sweet Surprise 💕</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .page-frame {
            width: 100%;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>

</head>

<body>

    <!-- =========================
         BACKGROUND MUSIC
         ========================= -->

    <audio id="backgroundMusic" autoplay loop preload="auto">

        <source src="{{ url_for('static', filename='birthday.mp3') }}" type="audio/mpeg">

    </audio>


    <!-- =========================
         WEBSITE PAGES
         ========================= -->

    <iframe id="pageFrame" class="page-frame" src="{{ url_for('page1') }}">
    </iframe>


    <script>

        const music =
            document.getElementById("backgroundMusic");

        music.volume = 0.35;


        /*
         * Coba menjalankan musik otomatis
         */

        music.play().catch(function () {

            console.log(
                "Autoplay diblokir oleh browser."
            );

        });


        /*
         * Kalau user melakukan interaksi
         * dengan website, coba play lagi.
         */

        document.addEventListener(
            "click",
            function () {

                if (music.paused) {

                    music.play().catch(function () {

                        console.log(
                            "Music masih diblokir browser."
                        );

                    });

                }

            }
        );

    </script>

</body>

</html>
