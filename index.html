<!DOCTYPE html>

<html lang="en">

<head>


    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Sweet Surprise 💕</title>

    <link rel="stylesheet" href="static/style.css">

    <style>
        html,
        body {

            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

        }

        .page-frame {

            width: 100%;
            height: 100vh;
            border: none;
            display: block;

        }

        .music-button {

            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 99999;

            padding: 15px 25px;

            font-size: 16px;

            background: white;

            color: black;

            border: 2px solid pink;

            border-radius: 10px;

            cursor: pointer;

        }
    </style>


</head>

<body>


    <!-- BACKGROUND MUSIC -->

    <audio id="backgroundMusic" loop preload="auto">

        <source src="static/birthday.mp3" type="audio/mpeg">

    </audio>


    <!-- WEBSITE PAGES -->

    <iframe id="pageFrame" class="page-frame" src="page1.html">
    </iframe>


    <!-- TEMPORARY MUSIC TEST BUTTON -->




    <script>

        const music =
            document.getElementById("backgroundMusic");


        music.volume = 0.35;


        /*
        Restore music position
        */



        /*
        Start music
        */

        function startMusic() {

            music.play()
                .then(function () {

                    console.log(
                        "MUSIC BERHASIL DIPUTAR"
                    );

                })
                .catch(function (error) {

                    console.log(
                        "MUSIC ERROR:",
                        error
                    );

                });

        }


        /*
        Save music position
        */



    </script>


</body>

</html>
